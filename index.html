  button:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  .counter { min-width:95px; text-align:center; color:#6a564d; font:600 14px/1.2 system-ui,-apple-system,sans-serif; }

<div class="controls">
<button aria-label="Previous page" id="prev">← Previous</button>
<div class="counter" id="counter">Page 1 of 6</div>
<button aria-label="Next page" id="next">Next →</button>
</div>
<p class="hint">Click the page, use the buttons, arrow keys, or swipe left/right.</p>
<script>
(() => {
  const pages=[...document.querySelectorAll('.page')];
  const prev=document.getElementById('prev'), next=document.getElementById('next'), counter=document.getElementById('counter'), stage=document.getElementById('stage');
  let current=0; // 0 = showing first page
  pages.forEach((p,i)=>p.style.zIndex=String(pages.length-i));
  function sync() {
    pages.forEach((p,i)=>{
      const shouldFlip=i<current;
      p.classList.toggle('flipped',shouldFlip);
      p.style.zIndex=shouldFlip ? String(i+1) : String(pages.length-i);
    });
    counter.textContent=`Page ${Math.min(current+1,pages.length)} of ${pages.length}`;
    prev.disabled=current===0;
    next.disabled=current>=pages.length-1;
  }
  function goNext() { if(current<pages.length-1) { pages[current].classList.add('flipping'); current++; sync(); setTimeout(()=>pages[current-1]?.classList.remove('flipping'),950); } }
  function goPrev() { if(current>0) { current--; pages[current].classList.add('flipping'); sync(); setTimeout(()=>pages[current]?.classList.remove('flipping'),950); } }
  next.addEventListener('click',goNext); prev.addEventListener('click',goPrev);
  pages.forEach(p=>p.addEventListener('click',goNext));
  document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ') goNext(); if(e.key==='ArrowLeft') goPrev(); });
  let startX=null,startY=null;
  stage.addEventListener('touchstart',e=>{ const t=e.touches[0]; startX=t.clientX; startY=t.clientY; },{passive:true});
  stage.addEventListener('touchend',e=>{ if(startX===null)return; const t=e.changedTouches[0], dx=t.clientX-startX, dy=t.clientY-startY; if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3) dx<0?goNext():goPrev(); startX=startY=null; },{passive:true});
  sync();
})();
</script>
